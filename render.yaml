services:
  - type: web
    name: maeumseojae
    runtime: node
    plan: free                 # 무료로 바로 배포됨. 단, 재배포·휴면 시 데이터(가입/기록)가 초기화된다.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # ── 데이터 영구 보존을 켜려면(유료 Starter, 월 $7) ──
      #   1) 위 plan 을 starter 로 변경
      #   2) 아래 DATA_DIR 두 줄과 disk 블록의 주석(#) 제거
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: maeumseojae-data
    #   mountPath: /var/data
    #   sizeGB: 1
